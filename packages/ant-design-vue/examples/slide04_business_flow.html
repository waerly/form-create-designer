<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="shared.css">
</head>
<body class="col" style="width: 960px; height: 540px; background: linear-gradient(180deg, #1a365d 0%, #0d2137 100%);">

<!-- 标题区域 -->
<div class="fit" style="padding: 20px 24px 0 24px;">
    <div class="row" style="align-items: center; justify-content: space-between;">
        <div class="row" style="align-items: center; gap: 12px;">
            <div style="width: 5px; height: 28px; background: #f6ad55; border-radius: 3px;"></div>
            <h1 style="color: white; font-size: 26px; font-weight: 700; margin: 0;">完整业务流程图</h1>
        </div>
        <div style="background: rgba(246,173,85,0.2); border: 1px solid rgba(246,173,85,0.4); padding: 5px 14px; border-radius: 16px;">
            <p style="color: #f6ad55; font-size: 11px; margin: 0;">全链路闭环</p>
        </div>
    </div>
</div>

<!-- 主流程图区域 -->
<div class="fill-height col" style="padding: 12px 24px 24px 24px;">

    <!-- 顶部AI层 -->
    <div class="fit" style="background: rgba(246,173,85,0.1); border: 1px solid rgba(246,173,85,0.3); border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;">
        <div class="row" style="align-items: center; gap: 12px;">
            <div style="width: 32px; height: 32px; background: #f6ad55; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <p style="font-size: 16px; margin: 0;">🤖</p>
            </div>
            <p style="color: #f6ad55; font-size: 13px; font-weight: 600; margin: 0;">AI 数据分析与推荐引擎 - 贯穿全链路的智能决策支持</p>
        </div>
    </div>

    <!-- 主业务流程 -->
    <div class="row fill-height" style="gap: 8px; align-items: center;">

        <!-- 工厂 -->
        <div class="col" style="width: 110px; text-align: center;">
            <div style="background: rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 10px; border: 1px solid rgba(255,255,255,0.1);">
                <p style="font-size: 28px; margin: 0 0 8px 0;">🏭</p>
                <p style="color: white; font-size: 13px; font-weight: 600; margin: 0;">高博集团</p>
                <p style="color: #f6ad55; font-size: 10px; margin: 4px 0 0 0;">工厂</p>
                <p style="color: rgba(255,255,255,0.5); font-size: 9px; margin: 8px 0 0 0;">生产备货</p>
            </div>
        </div>

        <!-- 箭头 -->
        <div style="text-align: center;">
            <p style="color: #f6ad55; font-size: 18px; margin: 0;">→</p>
            <p style="color: rgba(255,255,255,0.4); font-size: 8px; margin: 2px 0 0 0;">供货</p>
        </div>

        <!-- 中心仓 -->
        <div class="col" style="width: 110px; text-align: center;">
            <div style="background: rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 10px; border: 1px solid rgba(255,255,255,0.1);">
                <p style="font-size: 28px; margin: 0 0 8px 0;">📦</p>
                <p style="color: white; font-size: 13px; font-weight: 600; margin: 0;">中心仓</p>
                <p style="color: #f6ad55; font-size: 10px; margin: 4px 0 0 0;">意邦人汽配</p>
                <p style="color: rgba(255,255,255,0.5); font-size: 9px; margin: 8px 0 0 0;">库存分销</p>
            </div>
        </div>

        <!-- 箭头 -->
        <div style="text-align: center;">
            <p style="color: #f6ad55; font-size: 18px; margin: 0;">→</p>
            <p style="color: rgba(255,255,255,0.4); font-size: 8px; margin: 2px 0 0 0;">铺货</p>
        </div>

        <!-- 服务站/修理厂 -->
        <div class="col" style="width: 130px; text-align: center;">
            <div style="background: rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 10px; border: 2px solid #f6ad55; position: relative;">
                <p style="color: #f6ad55; font-size: 9px; font-weight: 600; margin: 0 0 6px 0;">汽配闪购B端</p>
                <p style="font-size: 28px; margin: 0 0 8px 0;">🔧</p>
                <p style="color: white; font-size: 13px; font-weight: 600; margin: 0;">服务站/修理厂</p>
                <p style="color: rgba(255,255,255,0.5); font-size: 9px; margin: 8px 0 0 0;">采购+安装</p>
            </div>
        </div>

        <!-- 箭头 -->
        <div style="text-align: center;">
            <p style="color: #48bb78; font-size: 18px; margin: 0;">→</p>
            <p style="color: rgba(255,255,255,0.4); font-size: 8px; margin: 2px 0 0 0;">服务</p>
        </div>

        <!-- C端用户 -->
        <div class="col" style="width: 110px; text-align: center;">
            <div style="background: rgba(72,187,120,0.2); border-radius: 12px; padding: 14px 10px; border: 2px solid #48bb78;">
                <p style="color: #48bb78; font-size: 9px; font-weight: 600; margin: 0 0 6px 0;">汽配闪购C端</p>
                <p style="font-size: 28px; margin: 0 0 8px 0;">👤</p>
                <p style="color: white; font-size: 13px; font-weight: 600; margin: 0;">C端用户</p>
                <p style="color: rgba(255,255,255,0.5); font-size: 9px; margin: 8px 0 0 0;">跟踪+预约</p>
            </div>
        </div>

        <!-- 箭头 -->
        <div style="text-align: center;">
            <p style="color: #ed64a6; font-size: 18px; margin: 0;">←</p>
            <p style="color: rgba(255,255,255,0.4); font-size: 8px; margin: 2px 0 0 0;">下单</p>
        </div>

        <!-- 直播间 -->
        <div class="col" style="width: 110px; text-align: center;">
            <div style="background: rgba(237,100,166,0.2); border-radius: 12px; padding: 14px 10px; border: 1px solid rgba(237,100,166,0.3);">
                <p style="font-size: 28px; margin: 0 0 8px 0;">📱</p>
                <p style="color: white; font-size: 13px; font-weight: 600; margin: 0;">抖音直播</p>
                <p style="color: #ed64a6; font-size: 10px; margin: 4px 0 0 0;">商城</p>
                <p style="color: rgba(255,255,255,0.5); font-size: 9px; margin: 8px 0 0 0;">流量入口</p>
            </div>
        </div>
    </div>

    <!-- 数据回流 -->
    <div class="fit" style="margin-top: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 16px;">
        <div class="row" style="align-items: center; justify-content: center; gap: 8px;">
            <p style="color: #f6ad55; font-size: 12px; margin: 0;">←</p>
            <p style="color: rgba(255,255,255,0.6); font-size: 10px; margin: 0;">数据回流：销售数据 → AI分析 → 工厂产能优化</p>
            <p style="color: #f6ad55; font-size: 12px; margin: 0;">←</p>
        </div>
    </div>
</div>
</body>
</html>
