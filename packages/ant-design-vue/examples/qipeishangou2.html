<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完整业务流程图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #1a365d 0%, #0d2137 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 标题区域 */
        .header {
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(246, 173, 85, 0.2);
            margin-bottom: 24px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-accent {
            width: 5px;
            height: 32px;
            background: #f6ad55;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .title-wrapper h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .badge {
            background: rgba(246, 173, 85, 0.15);
            border: 1px solid rgba(246, 173, 85, 0.4);
            padding: 6px 16px;
            border-radius: 16px;
            color: #f6ad55;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* AI层 */
        .ai-layer {
            background: rgba(246, 173, 85, 0.08);
            border: 1px solid rgba(246, 173, 85, 0.3);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-icon {
            width: 36px;
            height: 36px;
            background: #f6ad55;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .ai-layer p {
            color: #f6ad55;
            font-size: 13px;
            font-weight: 600;
            margin: 0;
        }

        /* 主流程 */
        .flow-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            padding: 20px 0;
            scroll-behavior: smooth;
        }

        .flow-container::-webkit-scrollbar {
            height: 6px;
        }

        .flow-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .flow-container::-webkit-scrollbar-thumb {
            background: rgba(246, 173, 85, 0.3);
            border-radius: 3px;
        }

        .flow-container::-webkit-scrollbar-thumb:hover {
            background: rgba(246, 173, 85, 0.5);
        }

        /* 流程卡片 */
        .flow-card {
            flex-shrink: 0;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 120px;
            transition: all 0.3s ease;
        }

        .flow-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(246, 173, 85, 0.1);
        }

        .flow-card.highlight {
            border: 2px solid #f6ad55;
            background: rgba(246, 173, 85, 0.1);
        }

        .flow-card.success {
            border: 2px solid #48bb78;
            background: rgba(72, 187, 120, 0.1);
        }

        .flow-card.pink {
            border: 1px solid rgba(237, 100, 166, 0.3);
            background: rgba(237, 100, 166, 0.08);
        }

        .flow-card .emoji {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .flow-card .company-name {
            color: white;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 4px 0;
            line-height: 1.4;
        }

        .flow-card .category {
            font-size: 10px;
            margin: 4px 0 0 0;
            font-weight: 500;
        }

        .flow-card .category.orange {
            color: #f6ad55;
        }

        .flow-card .category.green {
            color: #48bb78;
        }

        .flow-card .category.pink {
            color: #ed64a6;
        }

        .flow-card .description {
            color: rgba(255, 255, 255, 0.5);
            font-size: 9px;
            margin: 8px 0 0 0;
            line-height: 1.3;
        }

        .flow-card.highlight .category.orange {
            font-size: 9px;
            color: #f6ad55;
            margin: 0 0 6px 0;
            font-weight: 600;
        }

        .flow-card.success .category.green {
            font-size: 9px;
            color: #48bb78;
            margin: 0 0 6px 0;
            font-weight: 600;
        }

        /* 箭头 */
        .arrow {
            flex-shrink: 0;
            text-align: center;
            min-width: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .arrow-icon {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
            line-height: 1;
        }

        .arrow-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 8px;
            margin: 0;
            white-space: nowrap;
        }

        /* 数据回流 */
        .data-flow {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(246, 173, 85, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .data-flow-arrow {
            color: #f6ad55;
            font-size: 12px;
            margin: 0;
            font-weight: 600;
        }

        .data-flow-text {
            color: rgba(255, 255, 255, 0.65);
            font-size: 11px;
            margin: 0;
            line-height: 1.4;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header {
                padding-bottom: 16px;
                margin-bottom: 16px;
            }

            .title-wrapper h1 {
                font-size: 22px;
            }

            .badge {
                font-size: 11px;
                padding: 4px 12px;
            }

            .ai-layer {
                flex-direction: column;
                text-align: center;
                padding: 12px;
                margin-bottom: 16px;
            }

            .flow-container {
                padding: 12px 0;
                gap: 8px;
            }

            .flow-card {
                min-width: 100px;
                padding: 12px 8px;
                font-size: 11px;
            }

            .flow-card .emoji {
                font-size: 28px;
                margin-bottom: 8px;
            }

            .flow-card .company-name {
                font-size: 12px;
            }

            .arrow {
                min-width: 32px;
            }

            .data-flow {
                flex-direction: column;
                text-align: center;
                padding: 12px;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 标题区域 -->
    <div class="header">
        <div class="header-content">
            <div class="title-wrapper">
                <div class="title-accent"></div>
                <h1>完整业务流程图</h1>
            </div>
            <div class="badge">全链路闭环</div>
        </div>
    </div>

    <!-- AI智能决策层 -->
    <div class="ai-layer">
        <div class="ai-icon">🤖</div>
        <p>AI 数据分析与推荐引擎 - 贯穿全链路的智能决策支持</p>
    </div>

    <!-- 主业务流程 -->
    <div class="flow-container">
        <!-- 工厂 -->
        <div class="flow-card">
            <div class="emoji">🏭</div>
            <p class="company-name">高博集团</p>
            <p class="category orange">工厂</p>
            <p class="description">生产备货</p>
        </div>

        <!-- 箭头 -->
        <div class="arrow">
            <p class="arrow-icon" style="color: #f6ad55;">→</p>
            <p class="arrow-label">供货</p>
        </div>

        <!-- 中心仓 -->
        <div class="flow-card">
            <div class="emoji">📦</div>
            <p class="company-name">中心仓</p>
            <p class="category orange">意邦人汽配</p>
            <p class="description">库存分销</p>
        </div>

        <!-- 箭头 -->
        <div class="arrow">
            <p class="arrow-icon" style="color: #f6ad55;">→</p>
            <p class="arrow-label">铺货</p>
        </div>

        <!-- 服务站/修理厂 -->
        <div class="flow-card highlight">
            <p class="category orange" style="font-size: 9px;">汽配闪购B端</p>
            <div class="emoji">🔧</div>
            <p class="company-name">服务站/修理厂</p>
            <p class="description">采购+安装</p>
        </div>

        <!-- 箭头 -->
        <div class="arrow">
            <p class="arrow-icon" style="color: #48bb78;">→</p>
            <p class="arrow-label">服务</p>
        </div>

        <!-- C端用户 -->
        <div class="flow-card success">
            <p class="category green" style="font-size: 9px;">汽配闪购C端</p>
            <div class="emoji">👤</div>
            <p class="company-name">C端用户</p>
            <p class="description">跟踪+预约</p>
        </div>

        <!-- 箭头 -->
        <div class="arrow">
            <p class="arrow-icon" style="color: #ed64a6;">←</p>
            <p class="arrow-label">下单</p>
        </div>

        <!-- 抖音直播 -->
        <div class="flow-card pink">
            <div class="emoji">📱</div>
            <p class="company-name">抖音直播</p>
            <p class="category pink">商城</p>
            <p class="description">流量入口</p>
        </div>
    </div>

    <!-- 数据回流 -->
    <div class="data-flow">
        <p class="data-flow-arrow">←</p>
        <p class="data-flow-text">数据回流：销售数据 → AI分析 → 工厂产能优化</p>
        <p class="data-flow-arrow">←</p>
    </div>
</div>
</body>
</html>
